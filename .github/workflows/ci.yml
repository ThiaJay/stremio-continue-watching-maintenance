name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high

  publish_continue_watching_v1_7_5:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish Continue Watching v1.7.5 release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_COMMIT: f53d301db50f778aab20379f4c0c58a80e4c61d6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish immutable release record if absent
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          test "$(git show "$SOURCE_COMMIT:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version||''))")" = "1.7.5"
          if gh release view v1.7.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.7.5 already exists"
            exit 0
          fi
          git show "$SOURCE_COMMIT:CHANGELOG.md" | awk '
            /^## 1\.7\.5 / {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' > release-notes.md
          test -s release-notes.md
          gh release create v1.7.5 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "Continue Watching Maintenance v1.7.5" --notes-file release-notes.md

