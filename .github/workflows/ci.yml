name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high

  validate_aiostreams_maelstrom:
    permissions:
      contents: read
      statuses: write
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'ops/aiostreams-maelstrom-validation') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Validate AIOStreams Maelstrom hardening safely')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployed adapter candidate
        run: bash scripts/validate-aiostreams-maelstrom.sh
      - name: Publish validation commit status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          export STATUS_STATE=failure
          if [ "$VALIDATION_STATUS" = "success" ]; then
            export STATUS_STATE=success
          fi
          export VALIDATION_STAGE=unknown
          if [ -f validation-stage.txt ]; then
            export VALIDATION_STAGE="$(tr -cd 'A-Za-z0-9_-' < validation-stage.txt | head -c 60)"
          fi
          python3 - <<'PY'
          import json, os
          payload={
            "state":os.environ["STATUS_STATE"],
            "context":"aiostreams-maelstrom-validation-"+os.environ["VALIDATION_STAGE"],
            "description":"Guarded validation "+os.environ["VALIDATION_STATUS"]+" at "+os.environ["VALIDATION_STAGE"]
          }
          open("validation-status.json","w",encoding="utf-8").write(json.dumps(payload))
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data @validation-status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          if [ -f source-hash.txt ]; then
            export VALIDATED_SOURCE_HASH="$(tr -cd '0-9a-f' < source-hash.txt | head -c 64)"
            python3 - <<'PY'
            import json, os
            h=os.environ["VALIDATED_SOURCE_HASH"]
            open("source-status.json","w",encoding="utf-8").write(json.dumps({
              "state":"success",
              "context":"adapter-source-"+h,
              "description":"Exact live source bound for guarded validation"
            }))
            PY
            curl -fsS -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               --data @source-status.json               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" || true
          fi
          if [ -f validation-contract.json ]; then
            node - <<'NODE'
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("validation-contract.json","utf8"));
            const files=[];
            for(const [i,v] of (x.actual||[]).entries()){
              const safeName=String(v.name||"missing").replace(/[^A-Za-z0-9_.-]/g,"_").slice(0,40);
              const safeType=String(v.type||"missing").replace(/[^A-Za-z0-9_.-]/g,"_").slice(0,30);
              const file="binding-"+i+".json";
              fs.writeFileSync(file,JSON.stringify({
                state:"success",
                context:"adapter-binding-"+safeName+"-"+safeType,
                description:"Observed non-sensitive production binding"
              }));
              files.push(file);
            }
            fs.writeFileSync("date-status.json",JSON.stringify({
              state:x.dateOk?"success":"failure",
              context:"adapter-compat-date-"+String(x.compatibilityDate||"missing").replace(/[^A-Za-z0-9_.-]/g,"_"),
              description:"Observed production compatibility date"
            }));
            files.push("date-status.json");
            fs.writeFileSync("diagnostic-files.txt",files.join("\n")+"\n");
            NODE
            while IFS= read -r payload; do
              [ -n "$payload" ] || continue
              curl -fsS -X POST                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 --data @"$payload"                 "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" || true
            done < diagnostic-files.txt
          fi
  
  diagnose_continue_watching_target:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Diagnose Continue Watching v1.6.4 target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      TARGET_ITEM_HASH: d12921203e124b0e
      DEPLOYED_AT_MS: '1790020847444'
    steps:
      - uses: actions/checkout@v7
      - name: Diagnose privacy safe target state
        run: bash scripts/diagnose-v1.6.4-target.sh
      - name: Publish diagnosis status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          context="cw-target-diagnosis-failed"
          state="failure"
          if [ -f cw-diagnosis-context.txt ]; then
            context="$(tr -cd 'A-Za-z0-9_.-' < cw-diagnosis-context.txt | head -c 96)"
            state="success"
          fi
          python3 - <<PY
          import json
          open("cw-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"Privacy safe Continue Watching target diagnosis"
          }))
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data @cw-status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  deploy_aiostreams_maelstrom:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Deploy AIOStreams Maelstrom hardening safely'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - uses: actions/checkout@v7
      - name: Validate and deploy exact adapter candidate
        run: bash scripts/deploy-aiostreams-maelstrom.sh
      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          stage=unknown
          if [ -f deployment-stage.txt ]; then
            stage="$(tr -cd 'A-Za-z0-9_.-' < deployment-stage.txt | head -c 90)"
          fi
          context="aiostreams-maelstrom-deploy-failed-${stage}"
          description="Guarded adapter deployment failed at ${stage}"
          if [ "$DEPLOY_STATUS" = "success" ] && [ -f deployment-id.txt ] && [ -f deployed-source-hash.txt ]; then
            state=success
            short_id="$(tr -cd 'A-Za-z0-9' < deployment-id.txt | head -c 12)"
            source_short="$(tr -cd '0-9a-f' < deployed-source-hash.txt | head -c 16)"
            context="aiostreams-maelstrom-deploy-${short_id}"
            description="Verified adapter deployment source ${source_short}"
          fi
          python3 - <<PY
          import json
          open("deploy-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"$description"
          }))
          PY
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             --data @deploy-status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
  
  inspect_aiostreams_maelstrom_live:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Inspect AIOStreams Maelstrom production state'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - uses: actions/checkout@v7
      - name: Inspect live adapter source shape
        run: bash scripts/inspect-aiostreams-maelstrom-live.sh
      - name: Publish live state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          context="adapter-live-inspection-failed"
          if [ -f live-adapter-state.txt ]; then
            context="$(tr -cd 'A-Za-z0-9_.-' < live-adapter-state.txt | head -c 96)"
            state=success
          fi
          python3 - <<PY
          import json
          open("live-state-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"Bounded live adapter source inspection"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @live-state-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  deploy_continue_watching_v166:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Deploy Continue Watching v1.6.6 safely'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-watch-state-maintenance
      EXPECTED_SOURCE_COMMIT: 8177a9a313196242520fc1c4a4e7ca387c5cf405
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deploy exact Continue Watching v1.6.6 source
        run: bash scripts/deploy-continue-watching-v1.6.6.sh
      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          context="continue-watching-v166-deploy-failed"
          description="Continue Watching v1.6.6 guarded deployment failed"
          if [ "$DEPLOY_STATUS" = "success" ] && [ -f cw-v166-deployment-id.txt ] && [ -f cw-v166-source-hash.txt ]; then
            state=success
            short_id="$(tr -cd 'A-Za-z0-9' < cw-v166-deployment-id.txt | head -c 12)"
            source_short="$(tr -cd '0-9a-f' < cw-v166-source-hash.txt | head -c 16)"
            context="continue-watching-v166-deploy-${short_id}"
            description="Verified v1.6.6 deployment source ${source_short}"
          fi
          python3 - <<PY
          import json
          open("cw-v166-deploy-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"$description"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @cw-v166-deploy-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  accept_continue_watching_v166:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Accept Continue Watching v1.6.6 target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      SCRIPT_NAME: stremio-watch-state-maintenance
      EXPECTED_DEPLOYMENT_PREFIX: 5a12d7cd1d3a
      TARGET_ITEM_HASH: d12921203e124b0e
      MIN_BACKUP_MS: '1790027523000'
    steps:
      - uses: actions/checkout@v7
      - name: Wait for exact v1.6.6 target cleanup
        run: bash scripts/accept-continue-watching-v1.6.6.sh
      - name: Publish acceptance status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          stage=unknown
          if [ -f cw-v166-acceptance-stage.txt ]; then
            stage="$(tr -cd 'A-Za-z0-9_.-' < cw-v166-acceptance-stage.txt | head -c 48)"
          fi
          context="continue-watching-v166-acceptance-failed-${stage}"
          description="Exact-item v1.6.6 acceptance failed at ${stage}"
          if [ "$ACCEPT_STATUS" = "success" ] && [ -f cw-v166-acceptance.txt ]; then
            state=success
            context="$(tr -cd 'A-Za-z0-9_.-' < cw-v166-acceptance.txt | head -c 96)"
            description="Exact-item v1.6.6 cleanup verified"
          fi
          python3 - <<PY
          import json
          open("cw-v166-accept-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"$description"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @cw-v166-accept-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  deploy_continue_watching_v167:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Deploy Continue Watching v1.6.7 safely'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-watch-state-maintenance
      EXPECTED_SOURCE_COMMIT: 0bd19c7fe0740139d2253cf523a7d54506c580c8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deploy exact Continue Watching v1.6.7 source
        run: bash scripts/deploy-continue-watching-v1.6.7.sh
      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          context="continue-watching-v167-deploy-failed"
          description="Continue Watching v1.6.7 guarded deployment failed"
          if [ "$DEPLOY_STATUS" = "success" ] && [ -f cw-v167-deployment-id.txt ] && [ -f cw-v167-source-hash.txt ]; then
            state=success
            short_id="$(tr -cd 'A-Za-z0-9' < cw-v167-deployment-id.txt | head -c 12)"
            source_short="$(tr -cd '0-9a-f' < cw-v167-source-hash.txt | head -c 16)"
            context="continue-watching-v167-deploy-${short_id}"
            description="Verified v1.6.7 deployment source ${source_short}"
          fi
          python3 - <<PY
          import json
          open("cw-v167-deploy-status.json","w",encoding="utf-8").write(json.dumps({
            "state":"$state",
            "context":"$context",
            "description":"$description"
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @cw-v167-deploy-status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

