name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high


  deploy_story_order_v1_0_28:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Deploy Story Order v1.0.28 safely'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ThiaJay/stremio-story-order
          ref: c05ccb9ebbe93833d603fe40b696a2f28f823e1e
          path: story-order
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare guarded deploy script
        run: |
          cp scripts/deploy-story-order-v1.0.15.sh /tmp/deploy-story-order.sh
          sed -i 's/1.0.15/1.0.28/g' /tmp/deploy-story-order.sh
          sed -i 's/a82f7b054a9bcb2a6543b175f07bbde006d2c21c/c05ccb9ebbe93833d603fe40b696a2f28f823e1e/g' /tmp/deploy-story-order.sh
          chmod +x /tmp/deploy-story-order.sh
      - name: Deploy exact validated Story Order v1.0.28 source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: /tmp/deploy-story-order.sh
