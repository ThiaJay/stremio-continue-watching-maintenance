name: Retire superseded branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retire:
    if: github.event.head_commit.message == 'Retire superseded Continue Watching branches'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete recorded superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/anchorless-series-skip"
            "fix/continue-watching-backlog-fast-lane"
            "fix/metadata-identity-anchor"
            "fix/noncanonical-series-skip"
            "ops/aiostreams-maelstrom-validation"
            "ops/deploy-v1.6.4"
            "ops/stream-compatibility-inspect"
            "chore/consolidate-post-v1.7.3"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists after deletion: $branch"
              exit 1
            fi
          done
          printf '%s\n' "${branches[@]}" > retired-branches.txt
