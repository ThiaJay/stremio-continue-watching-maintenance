name: Publish Continue Watching v1.6.4

on:
  workflow_run:
    workflows: ["Verify Continue Watching v1.6.4 Northern Ireland acceptance"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: eb331eb1c3291045f6ae61839bba481b870f546a
      - name: Verify exact release source
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.6.4"
          test "$(git rev-parse HEAD)" = "eb331eb1c3291045f6ae61839bba481b870f546a"
      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.6.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.6.4 already published"
            exit 0
          fi
          awk '
            /^## 1\.6\.4 / {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Continue Watching Maintenance v1.6.4" > release-notes.md
          gh release create v1.6.4             --repo "$GITHUB_REPOSITORY"             --target eb331eb1c3291045f6ae61839bba481b870f546a             --title "Continue Watching Maintenance v1.6.4"             --notes-file release-notes.md
