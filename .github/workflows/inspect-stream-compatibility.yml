name: Inspect Stream Compatibility binge grouping

on:
  push:
    branches: [ops/stream-compatibility-inspect]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Stream Compatibility binge grouping safely'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - name: Inspect bindings by name and type only
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings")"
          node -e '
            const x=JSON.parse(process.argv[1]); if(!x.success)process.exit(2);
            const b=(x.result?.bindings||[]).map(v=>({name:v.name||"",type:v.type||""})).sort((a,b)=>a.name.localeCompare(b.name));
            console.log("bindings",JSON.stringify(b));
            console.log("compatibility_date",x.result?.compatibility_date||"");
          ' "$settings"

      - name: Retrieve deployed source and print bounded episode-selection context
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -D response-headers.txt \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content/v2" \
            -o worker-content.bin
          python3 - <<'PY'
          import re
          from email.parser import BytesParser
          from email.policy import default

          headers=open("response-headers.txt","rb").read()
          body=open("worker-content.bin","rb").read()
          msg=BytesParser(policy=default).parsebytes(headers+b"\r\n"+body)
          if msg.is_multipart():
              parts=[]
              for p in msg.iter_parts():
                  name=p.get_param("name", header="content-disposition") or p.get_filename() or "unnamed"
                  data=p.get_payload(decode=True) or b""
                  parts.append((name,data))
          else:
              parts=[("worker.js",body)]

          for name,data in parts:
              if name!="worker.js": continue
              text=data.decode("utf-8")
              lines=text.splitlines()
              start=244
              end=min(len(lines),390)
              print(f"context {name} {start+1}-{end}")
              for n in range(start,end):
                  line=lines[n]
                  line=re.sub(r"https?://[^\\s\\\"']+", "<url>", line)
                  line=re.sub(r"(?i)(token|authkey|api[_-]?key)\\s*[:=]\\s*[\\\"'][^\\\"']+[\\\"']", r'\\1="<redacted>"', line)
                  print(f"{n+1}: {line[:500]}")
          PY

