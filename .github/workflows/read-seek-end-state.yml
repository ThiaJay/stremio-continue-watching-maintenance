name: Read seek to end state

on:
  push:
    branches:
      - ops/read-seek-end-state-20260922

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      HASH_DARYL: 690565fd71ed814a
      HASH_ALVIN: 1cfd272f5e39bcee
    steps:
      - uses: actions/checkout@v7
      - name: Read privacy safe observations only
        shell: bash
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({sql:"SELECT item_hash,media_type,changed_at,time_offset,time_watched,times_watched,flagged_watched,duration,last_watched,mtime,prev_time_offset,prev_time_watched,prev_times_watched,prev_flagged_watched,prev_last_watched,prev_mtime FROM watch_observations_v2 WHERE item_hash IN (?,?) ORDER BY item_hash",params:[process.env.HASH_DARYL,process.env.HASH_ALVIN]}))')"
          response="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")"
          printf '%s' "$response" > observations.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("observations.json","utf8"));
          if(!x.success) process.exit(2);
          const rows=x.result?.[0]?.results||[];
          console.log("SAFE_OBSERVATIONS="+JSON.stringify(rows));
          NODE
          body2="$(node -e 'process.stdout.write(JSON.stringify({sql:"SELECT item_hash,observed_at,payload FROM diagnostic_results_v1 WHERE item_hash IN (?,?) ORDER BY item_hash",params:[process.env.HASH_DARYL,process.env.HASH_ALVIN]}))')"
          response2="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body2" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")"
          printf '%s' "$response2" > diagnostics.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("diagnostics.json","utf8"));
          if(!x.success) process.exit(2);
          const rows=(x.result?.[0]?.results||[]).map(r=>({item_hash:r.item_hash,observed_at:r.observed_at,payload:JSON.parse(String(r.payload||"{}"))}));
          console.log("SAFE_DIAGNOSTICS="+JSON.stringify(rows));
          NODE
