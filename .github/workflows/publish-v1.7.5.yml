name: Publish Continue Watching v1.7.5

on:
  push:
    branches: [ops/release-v1.7.5-20260926]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish Continue Watching v1.7.5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse duplicate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.7.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v1.7.5 already exists"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: f53d301db50f778aab20379f4c0c58a80e4c61d6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f53d301db50f778aab20379f4c0c58a80e4c61d6"
          test "$(node -p "require('./package.json').version")" = "1.7.5"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk '
            /^## 1\.7\.5 / {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create v1.7.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "f53d301db50f778aab20379f4c0c58a80e4c61d6" \
            --title "Continue Watching Maintenance v1.7.5" \
            --notes-file release-notes.md
