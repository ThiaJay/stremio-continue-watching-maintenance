name: Temporary sharp lock regeneration

on:
  push:
    branches:
      - security/sharp-0355-20261007
    paths:
      - .github/workflows/regen-sharp-lock.yml

permissions:
  contents: write

jobs:
  generate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lock with pinned patched sharp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency install and source
        run: |
          npm ci --ignore-scripts
          node -e "const p=require('./package-lock.json');if(p.packages['node_modules/sharp']?.version!=='0.35.5')process.exit(1)"
          npm run check
          npm test
          npm audit --audit-level=high
      - name: Commit only verified generated lockfile to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "security/sharp-0355-20261007"
          git config user.name "stremio-security-maintenance"
          git config user.email "3618451+ThiaJay@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | grep -qx package-lock.json
          git commit -m "Regenerate lockfile with patched sharp 0.35.5"
          git push origin HEAD:refs/heads/security/sharp-0355-20261007
