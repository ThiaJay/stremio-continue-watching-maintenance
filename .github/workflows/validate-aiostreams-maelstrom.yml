name: Inspect controller wrapper helpers

on:
  push:
    branches: [ops/stream-compatibility-regression-20260923]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-addon-binding-controller
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Extract controller helper logic safely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -D headers.txt "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content/v2" -o content.bin
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import re
          headers=Path("headers.txt").read_bytes(); body=Path("content.bin").read_bytes()
          matches=re.findall(br"(?im)^content-type:\s*([^\r\n]+)",headers)
          ctype=matches[-1].decode("latin1").strip() if matches else ""
          found=None
          if ctype.lower().startswith("multipart/"):
              synthetic=("Content-Type: "+ctype+"\r\nMIME-Version: 1.0\r\n\r\n").encode("latin1")+body
              msg=BytesParser(policy=default).parsebytes(synthetic)
              for p in msg.iter_parts():
                  raw=p.get_payload(decode=True) or b""
                  if b"addonCollectionSet" in raw and b"async function run" in raw:
                      found=raw; break
          else: found=body
          if found is None: raise SystemExit("module not found")
          lines=found.decode("utf-8","replace").splitlines()
          out=[]
          for n in range(1,min(200,len(lines)+1)):
              line=lines[n-1]
              line=re.sub(r'https?://[^"\'\s]+','URL',line)
              line=re.sub(r'[A-Za-z0-9_-]{40,}','LONG_VALUE',line)
              out.append(f"{n}: {line[:300]}")
          Path("ops-receipts").mkdir(exist_ok=True)
          Path("ops-receipts/addon-binding-controller-helpers-20260923.txt").write_text("\n".join(out)+"\n")
          PY
      - name: Commit sanitised helper receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/addon-binding-controller-helpers-20260923.txt
          git commit -m "ops: inspect addon binding controller helpers"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
