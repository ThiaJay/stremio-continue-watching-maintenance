name: Verify stream wrapper account repair

on:
  push:
    branches:
      - ops/stream-compatibility-regression-20260923

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Cross scheduler boundary and verify repair
        run: |
          set -euo pipefail
          sleep 75
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/stremio-addon-binding-controller/settings")"
          dbid="$(node -e 'const x=JSON.parse(process.argv[1]); const b=(x.result?.bindings||[]).find(v=>v.name==="BINDINGS_DB"); if(!b)process.exit(2); process.stdout.write(String(b.id||b.database_id||""));' "$settings")"
          query() {
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$1" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$dbid/query"
          }
          state="$(query '{"sql":"SELECT state_key,last_run,candidates_seen,rebinds,duplicates_removed,ambiguous,errors FROM controller_state WHERE state_key=\u0027latest\u0027"}')"
          events="$(query '{"sql":"SELECT provider,event_type,at,details FROM binding_events WHERE event_type IN (\u0027wrapper_manifest_refresh\u0027,\u0027wrapper_manifest_refresh_failed\u0027) ORDER BY at DESC LIMIT 10"}')"
          backups="$(query '{"sql":"SELECT created_at,expires_at FROM collection_backups ORDER BY created_at DESC LIMIT 3"}')"
          node - <<'NODE' "$state" "$events" "$backups"
          const fs=require("fs");
          const s=JSON.parse(process.argv[2]), e=JSON.parse(process.argv[3]), b=JSON.parse(process.argv[4]);
          if(!s.success||!e.success||!b.success) process.exit(2);
          const state=(s.result||[]).flatMap(x=>x.results||[])[0]||null;
          const events=(e.result||[]).flatMap(x=>x.results||[]).map(x=>({
            provider:String(x.provider||""),
            eventType:String(x.event_type||""),
            at:Number(x.at||0),
            details:(()=>{try{return JSON.parse(x.details||"{}")}catch{return {}}})()
          }));
          const backups=(b.result||[]).flatMap(x=>x.results||[]).map(x=>({
            createdAt:Number(x.created_at||0),
            expiresAt:Number(x.expires_at||0)
          }));
          const repair=events.find(x=>x.provider==="maelstrom"&&x.eventType==="wrapper_manifest_refresh"&&x.details?.toName==="Maelstrom"&&x.details?.toVersion==="2.34.1-adapter.8");
          if(!repair) {
            console.error("expected Maelstrom wrapper repair event not observed");
            process.exit(3);
          }
          fs.mkdirSync("ops-receipts",{recursive:true});
          fs.writeFileSync("ops-receipts/stream-wrapper-account-repair-20260923.json",JSON.stringify({
            schema:1,
            result:"passed",
            state,
            repairEvent:repair,
            latestBackup:backups[0]||null
          },null,2)+"\n");
          NODE
      - name: Commit sanitised acceptance receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/stream-wrapper-account-repair-20260923.json
          git commit -m "ops: record stream wrapper account repair"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
