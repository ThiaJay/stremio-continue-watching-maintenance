name: Deploy stream wrapper snapshot recovery

on:
  push:
    branches:
      - ops/stream-compatibility-regression-20260923

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SOURCE_SHA256: 729ff9a59f1833a2ea8491f83b4795102607894d362bd48dfc0f5eb70015b5bc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Deploy verified stale stream wrapper snapshot recovery
        run: bash scripts/deploy-wrapper-snapshot-recovery.sh
      - name: Commit sanitised deployment receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/wrapper-snapshot-recovery-deployment-20260923.json
          git commit -m "ops: record stream wrapper snapshot recovery deployment"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
