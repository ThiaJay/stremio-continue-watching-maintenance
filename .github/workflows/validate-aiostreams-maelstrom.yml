name: Deploy wrapper manifest refresh hardening

on:
  push:
    branches:
      - ops/stream-compatibility-regression-20260923

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SOURCE_SHA256: 9be4a03f457f3d5217092e694a32499d245a399d7d39b2bea3c5f0b9ed9fbe34
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Deploy guarded controller hardening
        run: bash scripts/deploy-addon-binding-controller-refresh.sh
      - name: Commit sanitised deployment receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/wrapper-manifest-refresh-deployment-20260923.json
          git commit -m "ops: record wrapper manifest refresh deployment"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
