name: Inspect stream compatibility regression

on:
  push:
    branches: [ops/stream-compatibility-regression-20260923]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Inspect deployed Worker source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/inspect-aiostreams-maelstrom-live.sh
          state="$(cat live-adapter-state.txt)"
          deployments="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments")"
          deployment_id="$(node -e 'const x=JSON.parse(process.argv[1]); const ds=x.result?.deployments||x.result||[]; const d=Array.isArray(ds)?ds[0]:null; if(!x.success||!d) process.exit(2); process.stdout.write(String(d.id||""));' "$deployments")"
          python3 - <<'PY'
          from pathlib import Path
          state=Path("live-adapter-state.txt").read_text().strip()
          digest=Path("live-adapter-hash.txt").read_text().strip()
          source=Path("live-content.bin").read_bytes()
          Path("ops-receipts").mkdir(exist_ok=True)
          out=[
            "stream_compatibility_live_regression_inspection",
            f"state={state}",
            f"source_sha256={digest}",
            f"literal_misspelling_present={b'Stream Compatability' in source}",
            f"literal_correct_generic_present={b'Stream Compatibility' in source}",
          ]
          Path("ops-receipts/stream-compatibility-regression-20260923.txt").write_text("\n".join(out)+"\n")
          PY
          printf 'deployment_id=%s\n' "$deployment_id" >> ops-receipts/stream-compatibility-regression-20260923.txt
      - name: Commit sanitised receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/stream-compatibility-regression-20260923.txt
          git commit -m "ops: record stream compatibility regression inspection"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
