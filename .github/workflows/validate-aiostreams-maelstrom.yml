name: Deploy fail closed wrapper refresh hardening

on:
  push:
    branches:
      - ops/stream-compatibility-regression-20260923

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SOURCE_SHA256: 764d05dad971e6c5ae87300dbc0ed0afb0e08dc444e5ff101840559a00130700
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Deploy provider scoped wrapper refresh handling
        run: bash scripts/deploy-controller-refresh-failclosed.sh
      - name: Commit sanitised deployment receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/wrapper-refresh-failclosed-deployment-20260923.json
          git commit -m "ops: record fail closed wrapper refresh deployment"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
