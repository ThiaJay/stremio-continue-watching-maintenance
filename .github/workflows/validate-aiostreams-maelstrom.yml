name: Deploy wrapper manifest refresh hardening

on:
  push:
    branches: [ops/stream-compatibility-regression-20260923]

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-addon-binding-controller
      EXPECTED_SOURCE_SHA256: 9be4a03f457f3d5217092e694a32499d245a399d7d39b2bea3c5f0b9ed9fbe34
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923

      - name: Retrieve and verify exact controller source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -D headers.txt "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content/v2" -o content.bin
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import hashlib,re,os
          headers=Path("headers.txt").read_bytes(); body=Path("content.bin").read_bytes()
          matches=re.findall(br"(?im)^content-type:\s*([^\r\n]+)",headers)
          ctype=matches[-1].decode("latin1").strip() if matches else ""
          found=None
          if ctype.lower().startswith("multipart/"):
              synthetic=("Content-Type: "+ctype+"\r\nMIME-Version: 1.0\r\n\r\n").encode("latin1")+body
              msg=BytesParser(policy=default).parsebytes(synthetic)
              for p in msg.iter_parts():
                  raw=p.get_payload(decode=True) or b""
                  if b"addonCollectionSet" in raw and b"async function run" in raw:
                      found=raw; break
          else: found=body
          if found is None: raise SystemExit("controller module not found")
          digest=hashlib.sha256(found).hexdigest()
          if digest != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit("production source changed")
          Path("live-controller.mjs").write_bytes(found)
          print("source_hash_ok",digest)
          PY

      - name: Patch stale wrapper manifest refresh gap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("live-controller.mjs")
          text=p.read_text()
          marker='__name(validateRoot, "validateRoot");\n'
          helper=r'''async function refreshWrapperDescriptor(provider, descriptor, fetchImpl = fetch) {
  const def = PROVIDERS[provider];
  assert(def && descriptor?.manifest?.id === def.wrapperId, "WRAPPER_DESCRIPTOR_INVALID");
  let u;
  try { u = new URL(String(descriptor.transportUrl || "")); } catch { throw new BindError("WRAPPER_TRANSPORT_INVALID"); }
  assert(u.protocol === "https:" && !u.username && !u.password && !u.search && !u.hash, "WRAPPER_TRANSPORT_INVALID");
  const allowedHost = provider === "maelstrom" ? "stremio-stream-compatibility.storyorder.workers.dev" : "aiometadata-smart-specials.storyorder.workers.dev";
  assert(u.hostname.toLowerCase() === allowedHost, "WRAPPER_HOST_MISMATCH");
  assert(u.pathname.endsWith("/manifest.json"), "WRAPPER_MANIFEST_PATH_INVALID");
  const r = await fetchImpl(descriptor.transportUrl, { redirect: "manual", signal: AbortSignal.timeout(8000), headers: { "user-agent": "Stremio-Binding-Controller/1.1" } });
  if (r.status >= 300 && r.status < 400) throw new BindError("WRAPPER_REDIRECT");
  if (!r.ok) throw new BindError("WRAPPER_HTTP_" + r.status);
  const m = await boundedJson(r), rs = resources(m);
  assert(m.id === def.wrapperId, "WRAPPER_ID_MISMATCH");
  assert(def.requiredResources.every((x) => rs.includes(x)), "WRAPPER_RESOURCE_MISMATCH");
  const name = String(m.name || "").trim();
  assert(name && name !== "Stream Compatibility" && name !== "Stream Compatability", "WRAPPER_VISIBLE_NAME_INVALID");
  return { ...descriptor, manifest: m };
}
__name(refreshWrapperDescriptor, "refreshWrapperDescriptor");
'''
          if text.count(marker)!=1: raise SystemExit("validateRoot marker mismatch")
          text=text.replace(marker,marker+helper,1)

          old='''  const before = await getCollection(env, true, deps.fetchImpl || fetch), beforeHash = await sha(before), b = await bindings(env);
  for (const def of Object.values(PROVIDERS)) assert(before.some((x) => x?.manifest?.id === def.wrapperId), "WRAPPER_MISSING_" + def.wrapperId);
  const decisions = [], removeIndexes = /* @__PURE__ */ new Set(), errors = [];
  let candidatesSeen = 0, ambiguous = 0, rebinds = 0;'''
          new='''  const before = await getCollection(env, true, deps.fetchImpl || fetch), beforeHash = await sha(before), b = await bindings(env);
  const wrapperUpdates = /* @__PURE__ */ new Map();
  for (const [provider, def] of Object.entries(PROVIDERS)) {
    const matches = before.map((x, i) => ({ descriptor: x, index: i })).filter((x) => x.descriptor?.manifest?.id === def.wrapperId);
    assert(matches.length === 1, matches.length ? "WRAPPER_DUPLICATE_" + def.wrapperId : "WRAPPER_MISSING_" + def.wrapperId);
    const current = matches[0];
    const freshDescriptor = await refreshWrapperDescriptor(provider, current.descriptor, deps.fetchImpl || fetch);
    if (await sha(freshDescriptor.manifest) !== await sha(current.descriptor.manifest || {})) {
      wrapperUpdates.set(current.index, freshDescriptor);
    }
  }
  const decisions = [], removeIndexes = /* @__PURE__ */ new Set(), errors = [];
  let candidatesSeen = 0, ambiguous = 0, rebinds = 0, wrapperRefreshes = wrapperUpdates.size;'''
          if text.count(old)!=1: raise SystemExit("run prelude target mismatch")
          text=text.replace(old,new,1)

          old2='''  let duplicatesRemoved = 0;
  if (removeIndexes.size) {
    const next = before.filter((_, i) => !removeIndexes.has(i));
    const expectedRemoved = before.length - next.length;'''
          new2='''  let duplicatesRemoved = 0;
  if (removeIndexes.size || wrapperUpdates.size) {
    const next = before.map((x, i) => wrapperUpdates.get(i) || x).filter((_, i) => !removeIndexes.has(i));
    const expectedRemoved = before.length - next.length;'''
          if text.count(old2)!=1: raise SystemExit("collection write target mismatch")
          text=text.replace(old2,new2,1)

          old3='''    if (afterHash === nextHash) {
      duplicatesRemoved = expectedRemoved;
      for (const def of Object.values(PROVIDERS)) assert(after.some((x) => x?.manifest?.id === def.wrapperId), "WRAPPER_REMOVED");'''
          new3='''    if (afterHash === nextHash) {
      duplicatesRemoved = expectedRemoved;
      for (const [provider, def] of Object.entries(PROVIDERS)) {
        const installed = after.find((x) => x?.manifest?.id === def.wrapperId);
        assert(installed, "WRAPPER_REMOVED");
        if (wrapperUpdates.size && wrapperUpdates.has(after.findIndex((x) => x?.manifest?.id === def.wrapperId))) {
          await event(env, provider, "wrapper_manifest_refresh", null, null, {
            name: installed.manifest?.name || null,
            version: installed.manifest?.version || null
          }, when);
        }
      }'''
          if text.count(old3)!=1: raise SystemExit("readback target mismatch")
          text=text.replace(old3,new3,1)

          old4='''  return { candidatesSeen, rebinds, duplicatesRemoved, ambiguous, errorCodes: [...new Set(errors)].slice(0, 20) };'''
          new4='''  return { candidatesSeen, rebinds, duplicatesRemoved, wrapperRefreshes, ambiguous, errorCodes: [...new Set(errors)].slice(0, 20) };'''
          if text.count(old4)!=1: raise SystemExit("return target mismatch")
          text=text.replace(old4,new4,1)

          old5='''  rollbackBinding,
  run,
  safeTransportRoot,'''
          new5='''  rollbackBinding,
  run,
  refreshWrapperDescriptor,
  safeTransportRoot,'''
          if text.count(old5)!=1: raise SystemExit("export target mismatch")
          text=text.replace(old5,new5,1)

          p2=Path("patched-controller.mjs")
          p2.write_text(text)
          print("patch_applied")
          PY
          node --check patched-controller.mjs

      - name: Run deterministic wrapper refresh tests
        shell: bash
        run: |
          set -euo pipefail
          cat > wrapper-refresh-test.mjs <<'NODE'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          globalThis.crypto=globalThis.crypto||crypto.webcrypto;
          const mod=await import("./patched-controller.mjs");
          const descriptor={
            transportUrl:"https://stremio-stream-compatibility.storyorder.workers.dev/private-token/manifest.json",
            manifest:{id:"org.thiajay.stream-compatibility",name:"Stream Compatability",version:"2.34.1-compat.7",resources:["stream"],types:["movie","series"],catalogs:[]}
          };
          const goodFetch=async()=>new Response(JSON.stringify({
            id:"org.thiajay.stream-compatibility",
            name:"AIOStreams",
            version:"2.34.1-adapter.8",
            resources:["stream"],
            types:["movie","series"],
            catalogs:[]
          }),{status:200,headers:{"content-type":"application/json"}});
          const refreshed=await mod.refreshWrapperDescriptor("maelstrom",descriptor,goodFetch);
          assert.equal(refreshed.transportUrl,descriptor.transportUrl);
          assert.equal(refreshed.manifest.name,"AIOStreams");
          assert.equal(refreshed.manifest.version,"2.34.1-adapter.8");
          assert.deepEqual(Object.keys(refreshed).sort(),Object.keys(descriptor).sort());
          const badName=async()=>new Response(JSON.stringify({
            id:"org.thiajay.stream-compatibility",name:"Stream Compatibility",version:"x",resources:["stream"]
          }),{status:200,headers:{"content-type":"application/json"}});
          await assert.rejects(()=>mod.refreshWrapperDescriptor("maelstrom",descriptor,badName),e=>e?.code==="WRAPPER_VISIBLE_NAME_INVALID");
          const badHost={...descriptor,transportUrl:"https://example.invalid/private-token/manifest.json"};
          await assert.rejects(()=>mod.refreshWrapperDescriptor("maelstrom",badHost,goodFetch),e=>e?.code==="WRAPPER_HOST_MISMATCH");
          console.log("wrapper_refresh_regressions_ok");
          NODE
          node wrapper-refresh-test.mjs

      - name: Verify settings and deploy exact candidate
        shell: bash
        run: |
          set -euo pipefail
          settings_before="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings")"
          node - <<'NODE' "$settings_before" > settings-before-safe.json
          const x=JSON.parse(process.argv[2]); if(!x.success) process.exit(2);
          process.stdout.write(JSON.stringify({
            compatibility_date:String(x.result?.compatibility_date||""),
            bindings:(x.result?.bindings||[]).map(v=>({name:String(v.name||""),type:String(v.type||"")})).sort((a,b)=>a.name.localeCompare(b.name))
          }));
          NODE
          candidate_hash="$(sha256sum patched-controller.mjs | awk '{print $1}')"
          printf '%s' '{"main_module":"worker.js"}' > metadata.json
          curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -F 'metadata=@metadata.json;type=application/json'             -F 'worker.js=@patched-controller.mjs;filename=worker.js;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" > deploy-response.json
          node -e 'const x=require("./deploy-response.json"); if(!x.success) process.exit(2)'
          settings_after="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings")"
          node - <<'NODE' "$settings_after" > settings-after-safe.json
          const x=JSON.parse(process.argv[2]); if(!x.success) process.exit(2);
          process.stdout.write(JSON.stringify({
            compatibility_date:String(x.result?.compatibility_date||""),
            bindings:(x.result?.bindings||[]).map(v=>({name:String(v.name||""),type:String(v.type||"")})).sort((a,b)=>a.name.localeCompare(b.name))
          }));
          NODE
          cmp settings-before-safe.json settings-after-safe.json
          printf '%s\n' "$candidate_hash" > deployed-controller-hash.txt

      - name: Verify deployed source and record receipt
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -D post-headers.txt "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content/v2" -o post-content.bin
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import hashlib,re,json
          headers=Path("post-headers.txt").read_bytes(); body=Path("post-content.bin").read_bytes()
          matches=re.findall(br"(?im)^content-type:\s*([^\r\n]+)",headers)
          ctype=matches[-1].decode("latin1").strip() if matches else ""
          found=None
          if ctype.lower().startswith("multipart/"):
              synthetic=("Content-Type: "+ctype+"\r\nMIME-Version: 1.0\r\n\r\n").encode("latin1")+body
              msg=BytesParser(policy=default).parsebytes(synthetic)
              for p in msg.iter_parts():
                  raw=p.get_payload(decode=True) or b""
                  if b"refreshWrapperDescriptor" in raw and b"addonCollectionSet" in raw:
                      found=raw; break
          else: found=body
          if found is None: raise SystemExit("deployed module missing")
          digest=hashlib.sha256(found).hexdigest()
          expected=Path("deployed-controller-hash.txt").read_text().strip()
          if digest!=expected: raise SystemExit("post deploy hash mismatch")
          Path("ops-receipts").mkdir(exist_ok=True)
          Path("ops-receipts/wrapper-manifest-refresh-deployment-20260923.json").write_text(json.dumps({
            "schema":1,
            "result":"deployed",
            "sourceSha256":digest,
            "settingsPreserved":True,
            "testsPassed":True,
            "refreshPolicy":"same installed wrapper transport, stable wrapper id, required resources, non-generic visible name, encrypted backup and collection readback"
          },indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/wrapper-manifest-refresh-deployment-20260923.json
          git commit -m "ops: record wrapper manifest refresh deployment"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
