name: Inspect stream compatibility binding schema

on:
  push:
    branches: [ops/stream-compatibility-regression-20260923]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT_NAME: stremio-stream-compatibility
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/stream-compatibility-regression-20260923
      - name: Inspect D1 schema safely
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings")"
          dbid="$(node -e 'const x=JSON.parse(process.argv[1]); const b=(x.result?.bindings||[]).find(v=>v.name==="BINDINGS_DB"); if(!b)process.exit(2); process.stdout.write(String(b.id||b.database_id||""));' "$settings")"
          test -n "$dbid"
          response="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"sql":"SELECT name, sql FROM sqlite_master WHERE type=\u0027table\u0027 ORDER BY name"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$dbid/query")"
          node - <<'NODE' "$response"
          const fs=require("fs");
          const x=JSON.parse(process.argv[2]);
          if(!x.success) process.exit(3);
          const rows=(x.result||[]).flatMap(r=>r.results||[]);
          const safe=rows.map(r=>({name:String(r.name||""),sql:String(r.sql||"")}));
          fs.mkdirSync("ops-receipts",{recursive:true});
          fs.writeFileSync("ops-receipts/stream-binding-schema-20260923.json",JSON.stringify({schema:1,tables:safe},null,2)+"\n");
          NODE
      - name: Commit sanitised schema receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-receipts/stream-binding-schema-20260923.json
          git commit -m "ops: record stream binding schema"
          git push origin HEAD:ops/stream-compatibility-regression-20260923
