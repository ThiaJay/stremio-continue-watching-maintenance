name: Repair Alvin stale Continue Watching progress

on:
  push:
    branches: [repair/alvin-stale-progress-20260923]
    paths:
      - .github/workflows/repair-alvin-stale-progress.yml
      - scripts/one-time-alvin-stale-progress-rule.js
      - scripts/run-one-time-alvin-stale-progress-repair.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
  SCRIPT_NAME: stremio-watch-state-maintenance
  PROD_SOURCE_COMMIT: 94a4d5ef91d10211fe3a09f3dfc4eb2c5ef47495
  ALVIN_HASH: 1cfd272f5e39bcee

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check repair script
        run: bash -n scripts/run-one-time-alvin-stale-progress-repair.sh

      - name: Repair stale progress and restore production
        run: bash scripts/run-one-time-alvin-stale-progress-repair.sh
