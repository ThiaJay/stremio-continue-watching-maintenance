name: Diagnose seek to end state

on:
  push:
    branches: [ops/diagnose-seek-end-state-20260922]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      SCRIPT_NAME: stremio-watch-state-maintenance
      REPORTED_HASH_A: 690565fd71ed814a
      REPORTED_HASH_B: 1cfd272f5e39bcee
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Set temporary privacy safe diagnostic targets
        run: bash scripts/set-reported-repair-secret.sh

      - name: Wait for scheduled diagnostic snapshot
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s%3N)"
          export STARTED_MS="$started"
          query_d1() {
            local body="$1"
            curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H 'Content-Type: application/json'               --data "$body"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          }
          for attempt in $(seq 1 45); do
            body="$(node - <<'NODE'
const hashes=[process.env.REPORTED_HASH_A,process.env.REPORTED_HASH_B];
process.stdout.write(JSON.stringify({
  sql:"SELECT item_hash, observed_at, payload FROM diagnostic_results_v1 WHERE item_hash IN (?,?) AND observed_at >= ? ORDER BY item_hash",
  params:[...hashes, Number(process.env.STARTED_MS)]
}));
NODE
)"
            response="$(query_d1 "$body")"
            printf '%s' "$response" > diagnostic-query.json
            count="$(node - <<'NODE'
const fs=require("fs");
const x=JSON.parse(fs.readFileSync("diagnostic-query.json","utf8"));
if(!x.success) process.exit(2);
const rows=x.result?.[0]?.results||[];
process.stdout.write(String(rows.length));
NODE
)"
            if [ "$count" -ge 2 ]; then
              node - <<'NODE'
const fs=require("fs");
const x=JSON.parse(fs.readFileSync("diagnostic-query.json","utf8"));
const rows=x.result?.[0]?.results||[];
const safe=rows.map(r=>({
  itemHash:String(r.item_hash),
  observedAt:Number(r.observed_at),
  payload:JSON.parse(String(r.payload||"{}"))
}));
fs.writeFileSync("diagnostic-safe.json",JSON.stringify(safe,null,2)+"\n");
console.log(JSON.stringify(safe));
NODE
              exit 0
            fi
            sleep 20
          done
          echo "::error::Fresh diagnostic snapshot was not observed"
          exit 1

      - name: Remove temporary target secret
        if: always()
        shell: bash
        run: bash scripts/remove-reported-repair-secret.sh
